spring:
  application:
    name: camping-reservation-legacy
  
  datasource:
    url: jdbc:mysql://localhost:3306/reservation
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    com.camping: DEBUG
